<h1 class="article-title">좋은 취향 담론과 무위자연의 한계</h1>
<div class="article-meta">
<time>2025-03-10</time>
<span class="dot">&middot;</span>
<span>3 min read</span>
</div>
</header>
<div class="divider"></div>
<div class="article-body" id="article-body"></div>
<script id="post-markdown" type="application/json">"---\ntitle: 좋은 취향 담론과 무위자연의 한계\ndate: 2025-03-10\nexcerpt: 우리는 어떤 방향까지만 배워야 할까?\ntags: Culture, Lifestyle, Art, Development\nreading_minutes: 3\n---\n\n## 좋은 취향 담론: 권력과 절제의 언어\n\n좋은 취향 담론은 상당히 특이한 두 가지 맥락을 같이 지닌다. 첫째는 억압적인 부르봉 왕조의 그림자, 둘째는 절제된 지식인상의 진화이다.\n중세 서양 세계의 철학은 꽤나 분명한 선을 가졌다. 예를 들면, 종교음악은 무결하고 절대적인 것, 세속악은 웃고 떠들 수는 있어도 거짓된 우아함을 지니는 것 등등, 좋게 말하면 신성하고 나쁘게 말하면 엄격한 시대상이었다. 그 때에 맥주를 한 잔 마시며 노래하는 사람들이 신성함에 대해 노래할 수는 있어도 신성함에 대한 깊은 사색이 진정으로 받아들여질 시대였느냐 하면, 철저하게 '실용'으로 바라봐지는 측면은 꽤 강했다.\n이후 르네상스 시기에, 세속악이 진지하게 다루어지기 시작하였다. 기존의 마쇼와 같은 사람들이 세속악'도' 작곡하였다면, 르네상스 시대에는 본격적으로 세속악'을' 작곡하는 시대였다. 이 시대가 흥미로운 것은, 헨리 퍼셀 이후 오랜 음악적 공백기를 겪었다고 알려진 영국이 그보다 앞서 음악으로 크게 융성하던 시기이기 때문이다.\n이 시기에는 자유롭게 발달하는 화려한 기법이 있었으나, 사생활 추문으로 결국 영국을 떠나야 했던 '존 불', 반면 자신의 천주교 신앙을 지키기 위해 고집 있게 살아간 '윌리엄 버드' 등 인간 군상이 꽤 다양하였다. 따라서 인간의 예절이라고 할 것은 어디까지나 피고용 계층이었던 음악가들 사이에선 개인의 가정 교육에서의 문제가 크게 영향을 주었다.\n\n반면 태양왕 루이 14세 시절은 꽤 특이하다. 예법뿐만 아니라 개인의 사생활까지 왕정이 감시하던 이 시대에는, 공중목욕탕이 쇠퇴하며 위생 문제가 커졌다는 비판도 받지만, 신사적인 예절의 모태가 되는 엄격한 법도가 비로소 이 시대에 시작이 된다고 할 것이다.\n이 시대는 절제 속에서의 쾌락, 균형 아래에서의 흥미로운 파격을 중시하였으며, 드물게는 '장-필리프 라모'와 같은 별종이 나왔지만, 그들 역시 궁정의 예절 안에서 조금 희롱하는 수준에서 그치고 말았다. 그 법도는 민중에게 큰 부담이었지만, 이후 '프랑스적인 문화'라는 개념의 큰 틀이 이 시기에서 나왔다는 것은 역사의 아이러니이다.\n어쨌든, 이 시대의 그늘 속에서도 우리가 배울 것은 분명히 있다.\n\n### 명료하게, 그러나 노골적이지 않게\n\n이 시대는 성악의 아티큘레이션, 발레의 스텝, 심지어는 기악곡의 음표 하나까지 '명료하나 노골적이지 않은' 우아함을 따라간다.\n굳이 이것을 심리적인 기제로 비유한다면 일본의 '혼네-다테마에' 예절과 비슷한 점이 있다.\n이러한 예절은 어떠한 경우에는 감정에 숨기 쉬운 구조를 드러내나, 어떠한 경우에는 꼭 해야 할 말까지 숨겨 버린다.\n이 시기의 귀족들은 스스로가 이성적이고 통제 가능하다고 믿었으며, 그것은 표면적이더라도 합리성에 대한 열망이었다.\n이러한 시기의 작고 명료한 것에 대한 지향은 신파극과는 또 다른 지향점이며, 꽤 오래 사람들 사이에서 의도적으로 가려졌다.\n다만 이 시대의 우아함을 이야기한다고 해서 신분제의 그늘까지 없던 일이 되는 것은 아니다.\n\n### 예의는 중요하지만 언제나 가식과 쌍둥이이다\n\n예의와 가식은 어느 정도 궤를 같이 한다. 이것들은 드러난 사실에 대한 이불이지만, 잘못 덮으면 냄새나는 것을 이불로 가려 둔 꼴이 된다.\n일본 속담 '냄새 나는 것에 뚜껑을 덮는다'가 꼬집는 일은 우리 사회에서도 흔히 볼 수 있다.\n누군가를 위하는 일이 누군가를 속이는 일이 되어서는 안 되지만, 현실에서 이 둘은 자주 붙어 다닌다.\n이것은 한 시대의 모순이라기보다, 화려한 색과 독을 함께 지닌 독개구리처럼 떼어 내기 어려운 성질에 가깝다.\n\n## 무위자연: 자연스럽게 가져가라\n\n노자의 도덕경에서 말하기를 '물은 위에서 아래로 흐르며 더럽고 깨끗함을 가리지 아니한다'고 한다.\n이러한 자연스럽게 녹아드는 성질을 크게 본받아 '물처럼 사는 것이 선하다'는 부류의 주장이 널리 퍼져 있으며, 현대에도 통용된다.\n그러나 물 같다는 것이 '탁해지더라도 대충 흘러가는 것'이 되어서는 안 된다.\n유연하게 옮겨가는 태도 자체는 매우 존경할 일이다. 그러나 언제나 글로 박제된 말은 곡해되기 마련이며, 때로는 좋지 않은 방향으로 곡해되고는 한다.\n그래서 물처럼 흐르라는 추상적인 말은 누군가에게는 보약이 되고, 누군가에게는 독이 된다.\n\n## 경계, 역시 경계를 보자\n\n무엇이 우아하지만 비겁하지 않은 것일까? 개인의 의견일 뿐이라지만 내가 강하게 말하는 것은 '슬프되 눈물은 나지 않는 것'이나 '행복하지만 광란으로 빠지지 않는 것'이다.\n이러한 산뜻한 우아함을 가진다는 것은 음악이나 문화가 사람을 이상하게 이끌 가능성을 낮춘다. 좋은 가사는 마음을 헤집지 않아야 하고, 좋은 조각은 사람을 고집에 빠뜨리지 않아야 한다. 그러나 이것의 판단 기준을 규범화하려 드는 것은 루이 14세나 플라톤의 패착만큼이나 크나큰 똑똑함의 함정이 될 것이다.\n\n아름답지만 지나치게 흔들지 않는 것, 끊을 듯 흘러가는 물. 그러한 것에 아름다움은 기다린다. 그리고 그 아름다움의 그림자에는 언제나 위험이 함께 있다.\n그 위험을 외면하지 않고 다스리는 것. 그것이 문화를 만드는 사람이든 소비하는 사람이든 가져야 하는 '21세기의 자연'이라고 믿는다.\n"</script>
