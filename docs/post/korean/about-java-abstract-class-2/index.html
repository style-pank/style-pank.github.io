<h1 class="article-title">그래도 이럴 땐 추상 클래스를 써야지</h1>
<div class="article-meta">
<time>2026-03-19</time>
<span class="dot">&middot;</span>
<span>2 min read</span>
</div>
</header>
<div class="divider"></div>
<div class="article-body" id="article-body"></div>
<script id="post-markdown" type="application/json">"---\ntitle: 그래도 이럴 땐 추상 클래스를 써야지\ndate: 2026-03-19\nexcerpt: 자바에서 추상 클래스를 쓰는 게 나은 상황은?\ntags: Software, Tools, UI/UX, Algorithm, Java\nreading_minutes: 2\n---\n\n## 공통되며, 크게 다르지 않은 것들은 추상 클래스로\n\n앞 포스트의 조류 예시로 따지면 보다, 뛰다와 같은 것들은 '공통되어 보이지만 여전히 다른 것'에 속한다.\n그러나 '두 다리는 발달되어야 한다'는 매우 공통적인 사항이고, 정상 발달된 조류라면 두 다리가 있다.\n그렇다면 다리를 발달시키게 하는 명령들은 추상 클래스로 두는 것이 맞다.\n\n예를 들자면 이러한 식이다.\n\n조류-두 다리가 발달됨.\n\n펭귄(조류 상속): 다리뼈를 길게 늘리고 살을 찌워 다리를 묻는다\n키위(조류 상속): 다리가 발달 중에 굵어지게 하고 근육을 많이 붙인다.\n참새(조류 상속): 다리는 뛰는 데 특화되어 뚜벅뚜벅 걷기 힘들다.\n\n셋은 매우 다른 방식의 다리를 가졌지만 셋 모두 '다리가 발달하기 위한 명령'을 요구한다. 이러한 상황에서 추상 클래스를 사용한다.\n\n## 나무를 그릴 때 몸통은 비슷하다\n\n미술학도들에게 나무를 그리라고 시키면, 가지의 발달 방식이나 잎맥 등의 것 이전에, 가운데의 굵은 줄기를 그리는 방식은 비슷하다고 말할 것이다.\n은행나무의 가지가 뻗치고, 능수버들은 늘어지는 것과 별개로 둘의 줄기를 '크로키하는 법'은 같다. 둘의 묘사와 두께 차이는 그 이후의 문제이다.\n그러하기 때문에 추상 클래스는 빠른 클래스의 역할을 할 필요가 있는 것이다.\n\n이러한 구조는 자바에서만 좋은 것이 아니고 '유사 상속'을 만들어서 C에서도 할 만한 주제이다.\n비즈니스 로직이 대체로 '비대하고 현실 세계를 반영하는 것'으로 대표되지만 그 기법들 중 분명 미니멀한 설계를 위해 노력한 것은 존재한다.\n이러한 것들에 대해서 열린 마음으로 차용하여 연습하는 것은 돈을 벌기 위한 개발이 아닌 구조의 원천을 발굴하는 '개발 고고학자'가 되기 위한 여정에서 중요하다.\n따지고 보면 21세기의 지층조차 발굴의 대상이 될 수 있다는 것을 생각하면 어떤 구조로 뻗어나가야 하는지를 매우 중요하게 보지 않을 수가 없다.\n"</script>
