<h1 class="article-title">이스크라-반란을 꿈꾸는가</h1>
<div class="article-meta">

<script id="post-markdown" type="application/json">"---\ntitle: 이스크라-반란을 꿈꾸는가\ndate: 2026-10-01\nexcerpt: 한편으로는 생각이 참 많아지는 노래\ntags: Culture, Lifestyle, Art, Punk, Music\nreading_minutes: 3\n---\n\n\n## 가사\n\n[Youtube](https://www.youtube.com/watch?v=zzhadtcZy7A&list=RDzzhadtcZy7A)\n\n전파와 기계음만 떠도는 거리 햇살 사라진 도시를 지나\n저 어둔 세상으로 시선을 던진다\n싸늘히 식어버린 기억 밖으로 낯선 생존의 고독이 지배하는 이 도시\n\n무너진 민주주의의 대형간판 뒤에 서서\n네온싸인 그 불빛 아래로 텅 빈 거리는\n터질 것 같은 심장의 숨소리 쏟아지는 침묵의 비명소리\n까마득한 그날의 하늘에 시선 던진다\n2015년 거리 아~ 인간들아 어디에 숨었는가\n2015년 거리 아~ 인간들아 어디서 숨을 쉬는가\n\n무너진 민주주의의 대형간판 뒤에 서서\n네온싸인 그 불빛 아래로 텅 빈 거리는\n터질 것 같은 심장의 숨소리 쏟아지는 침묵의 비명소리\n까마득한 그날의 하늘에 시선 던진다\n2015년 거리 아~ 인간들아 어디에 숨었는가\n2015년 거리 아~ 인간들아 어디서 숨을 쉬는가\n\n## 개인적인 평가\n\n일단 필자는 고교 시절까지 몸이 약했고, 군대 역시 다녀오지 못했기 때문에 거창한 정치 비판이나 하는 것은 분수에 어긋나는 일이라고 생각하여서 앞으로는 정치적 의견을 표명하는 일은 별로 없을 것이다.\n\n그러나 잘 떠올려 보면, 어쩐지 유년기의 2000년대보단 2010년대가, 2010년대보다는 다 자란 2020년대가 더 건조하지 않았나 생각이 들기도 한다.\n\n분명 세대가 바뀌며 부조리도 줄어들고, 회식, 군기 문화 등이 부드러워지는 것도 사실이다. 하지만 정치적 극단화는 끝없는 투쟁이 마침내 서로를 향하고 있는 것이 아닌가.\n\n세상이 바뀌고, 체감이 좋아지지만 이제 기득권은 점점 더 견고해지지 않을까 생각한다. 하지만 당장 눈앞의 직장 상사는 우리를 혼내지 않는 시대가 왔으니, '인권'이란 게 좋아졌다면 좋아진 것도 맞고...\n\n결국 신분제로의 회귀는 당연한 관성인가? 나향욱이 \"국민은 개돼지\"라고 일컬은 사건에는 분개하지만, 실제로 우리에게 그를 막을 어떠한 권력이 있었는가? 누구의 동의도 얻지 않았지만 그는 또 다시 고위 관직으로 복직했지 않는가.\n\n애초에 민주주의라는 것도 온전히 시행되기 힘들며, 현대 사회 역시 왕정이나 권위주의에 상당 부분을 기대지 않는가 생각한다.\n\n그런데 매번 지역끼리, 민중끼리 편 갈라 싸우지 여야 할 것 없는 정치인들에게는 공정한 잣대를 들이밀지 못한다.\n\n경상도는 어떻고, 전라도는 어떻고 갈라 싸우고, 투표도 논쟁도 지역주의... 솔직히 대구 시민들도 동대구역의 박정희 동상이 논란이 있는 것을 알고, 역대 시장들의 비리를 알고, 무엇이 잘못된지 안다. 하지만 작금의 언론사들은 너무 '내 고향 물어뜯기'에 열중해서 한 지역을 군국주의의 광풍에 미친 극우 집단으로 몰아간다는 감상이다. 대구 역시 지방이고 이런저런 문제가 많은 곳이지만, 조용하고 품격있는 사람들의 작은 도시이다. 같은 한국인끼리 침묵을 넘어서 마녀사냥을 하는 것을 보고 정당한 언론인이라 할 수 있을 것인가...\n"</script>
