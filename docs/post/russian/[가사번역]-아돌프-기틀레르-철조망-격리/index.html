<h1 class="article-title">아돌프 기틀레르 - 철조망 격리</h1>

<script id="post-markdown" type="application/json">"---\ntitle: 아돌프 기틀레르 - 철조망 격리\ndate: 2026-05-05\nexcerpt: 가사 번역과 해설, 꽃단장한 파시즘에 대한 풍자\ntags: Music, Culture, Punk, Translation\nreading_minutes: 3\n---\n\n## 음악\n\n[YouTube](https://youtu.be/eCuU9PWOqCA?si=Yq_imWzP2Nce7h-r)\n\n이름부터 \"아돌프 히틀러\"의 러시아식 발음에서 따온 난해한 밴드이다. 찬양이 아니라, 가장 불편한 이름을 일부러 내세워 듣는 사람을 멈춰 세우는 소련 말기 언더그라운드 펑크 특유의 도발이다. 그러니 이 곡은 이름이 아니라, 가사가 풍자하는 대상을 읽어야 이해할 수 있다.\n\n가사는 단순하다. '철조망을 더 설치하라'는 명령이 반복되고, 격리는 '위대한 격리', '전 우주적 격리'로 점점 커진다. 누가 누구를 왜 가두는지는 끝까지 나오지 않는다. 이유는 사라지고 울타리를 치는 행위만 남는다. 적과 우리를 나누고, 경계 밖을 배제하는 것 자체를 목적으로 삼는 논리, 이 곡이 겨냥하는 것은 바로 파시즘의 그 작동 방식이다.\n\n나는 이 풍자가 소련 말기에만 해당한다고 보지 않는다. 현대 사회는 파시즘에서 벗어났다고 말하고, 제도상으로는 분명 그렇다. 하지만 파시즘을 떠받치던 논리, 즉 획일성을 미덕으로 삼고 경계 밖을 밀어내는 사고방식은 형태를 바꿔 여전히 남아 있다고 생각한다. 나는 이것을 '꽃단장한 파시즘'이라고 부르고 싶다.\n\n일상에서도 그 흔적은 보인다. \"안정적인 직장에서 평범하게 일하는 것이 건실한 삶\"이라는 기준에서 벗어나는 선택은 법으로 금지되지 않지만, 실제로는 쉽지 않다. 우리는 오랜 교육 속에서 특정 직업을 천시하는 법을 배우고, 암기와 반복 학습을 거치며 상식과 편견을 구분 없이 받아들인다. 무엇을 입고, 어떤 말을 하고, 어떤 생각을 할지에 대한 자유는 명문으로는 보장되어 있지만, 그 자유를 실제로 행사하는 데에는 여전히 대가가 따른다.\n\n국제 정세에서도 마찬가지이다. 미·중 갈등과 신냉전, 반도체를 둘러싼 규제 경쟁, 남북을 '적대적 두 국가'로 규정하려는 북한의 주장까지, 21세기의 세계는 다시 철조망을 세우는 방향으로 움직이고 있다. 이 곡을 들으며 나는 흑백사진 속 과거보다 지금의 뉴스가 먼저 떠올랐다.\n\n파시즘의 논리가 형태를 바꿔 남아 있는 한, 이런 펑크 음악은 빛바랜 과거가 되지 않는다. 그때까지는 \"호이, 멈추지 마\"라고 말하며 나의 방어선을 지키는 것이 우선이다.\n\n## 노래 가사 \"철조망 격리\"\n\n[1절]\n\n더 이상 지체하지 마\n\n철조망을 더 설치해\n\n철조망을 더 설치해\n\n철조망을 더 설치해\n\n가시철조망을 더 설치해\n\n\n[후렴]\n\n철조망 격리! (우!)\n\n위대한 격리!\n\n전 우주적 격리!\n\n\n[2절]\n\n철조망은 이제 그만\n\n철조망을 더\n\n철조망을 더\n\n가시철조망을 더\n\n\n[후렴]\n\n철조망 격리!\n\n우주적 격리!\n\n철조망 격리!\n\n전 세계적 격리!\n\n\n[3절]\n\n철조망을 더 설치해\n\n철조망을\n\n가시철조망을\n\n철조망을\n\n가시철조망을\n\n철조망을\n\n\n[후렴]\n\n철조망 격리!\n\n\n[간주]\n\n\n[아웃트로]\n\n격리 — 오직 격리뿐!\n\n오직 격리, 호이!\n"</script>
