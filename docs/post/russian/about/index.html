<script id="post-markdown" type="application/json">"---\ntitle: Russian 카테고리 소개 — 러시아어 가사 번역과 해설\ndate: 2026-03-10\nexcerpt: 러시아어 가사 번역과 해설\ntags: Russian, Lyrics, Translation, Punk\nreading_minutes: 2\n---\n\n# Russian 카테고리 소개\n\n이 카테고리는 **러시아어 가사 번역과 해설**을 다룹니다. 러시아 록과 펑크의 대표 곡들을 한국어로 옮기고, 가사 속 역사와 사회적 배경을 함께 풀어갑니다.\n\n## 다루는 범위\n\n- **가사 번역**: 그라즈단스카야 오보로나, 아돌프 기틀레르, 인스트룩치야 포 비지바니유 등\n- **해설**: 곡이 나온 시대, 밴드의 정치적 위치, 러시아어 표현의 뉘앙스\n"</script>
