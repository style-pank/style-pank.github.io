<script id="post-markdown" type="application/json">"---\ntitle: 그라즈단스카야 오보로나 - 느닷없이 (Наповал)\ndate: 2026-04-03\nexcerpt: 가사 번역 예고르 레토프, 어느 날 문득 끝나 버린 걸음에 대하여\ntags: Music, Culture, Punk, Translation\nreading_minutes: 3\n---\n\n## 가사 번역: 느닷없이 (Наповал)\n\n아무 이유도 근거도 없이\n요행만 바라며, 그냥 그렇게\n눈송이를 데우고 안경알을 닦다가\n가을이 온 줄도 몰랐네\n\n그렇게 쫓기듯, 그렇게 걸었네\n자신의 뒤꿈치를 바짝 추격하며\n그저 제 발꿈치를\n취한 듯 짓밟으며 걸었네\n\n한계를 넘어, 낙원을 지나\n한 번 건너, 일 년을 지나\n그러다 머리칼 생각은 못 했지\n울타리에 걸려버렸네\n\n그저 살짝 베였을 뿐인데\n알고 보니 즉사했고\n고작 한 발짝 내디뎠을 뿐인데\n벌써 똥통에 머리끝까지 잠겼네\n\n새벽녘 탁자 위에는\n알록달록한 유리 조각들\n알록달록한 헝겊 조각들\n뭐가 뭔지 씨팔¹ 하나도 모르겠네\n\n## 해설\n\n예고르 레토프(Егор Летов)는 그라즈단스카야 오보로나를 이끈 시인이자 음악가로, 거친 사운드 밑에 섬세한 언어 감각을 숨겨 둔 작사가로 평가받는다.\n\n이 곡은 정치적 구호보다는 개인의 허무를 다룬다. 별 이유 없이 요행을 바라며 걷던 사람이, 제 발꿈치를 쫓듯 서두르다 어느 순간 걸려 넘어지고, 정신을 차려 보니 이미 돌이킬 수 없는 곳에 와 있다. 제목 'Наповал'은 총에 맞아 '그 자리에서 즉사하다'라는 뜻으로, 작은 상처인 줄 알았던 것이 치명상이었다는 가사의 반전을 한 단어로 압축한다.\n\n마지막 연의 알록달록한 유리 조각과 헝겊 조각은 밤새 흩어진 삶의 파편처럼 보인다. 레토프는 그 앞에서 답을 내리지 않는다. 그저 '하나도 모르겠다'고 솔직하게 털어놓을 뿐이다.\n\n*¹ 원문에서도 러시아어 비속어(мат)가 쓰인 부분으로, 원문의 어감을 살려 그대로 옮겼다.*\n"</script>
