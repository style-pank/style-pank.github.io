<script id="post-markdown" type="application/json">"---\ntitle: 그라즈단스카야 오보로나 - 날씨의 변화 (Перемена погоды)\ndate: 2026-05-05\nexcerpt: 가사 번역 예고르 레토프, 냉소로 쓴 1980년대의 풍경\ntags: Music, Culture, Punk, Translation\nreading_minutes: 3\n---\n\n## 날씨의 변화 (Перемена погоды)\n\n## 번역\n\n더러운 공포가 분노를 달래주었지\n차갑게 스치는 휘파람이 신경을 찢어놓았어\n너희는 고기 한 조각에 매수당했고\n우린 젖은 모래 속에 파묻혔어\n아스팔트에 짓밟힌\n구슬 목걸이와 알록달록한 눈동자를 봤니?\n난 절대 믿지 않을 거야\n날씨가 바뀔 거라고\n너희 목구멍엔 뼈가 걸려 있어\n자를 대고 봐도 모든 게 비뚤비뚤해\n너희 지도자들을 공경하라\n식사 전에 손을 씻어라\n난 네 뺨에 묻은 피를 봤어\n타격에 노출된 그 뺨에\n난 절대 믿지 않을 거야\n날씨가 바뀐다는 걸!\n날씨가 바뀐다는 걸!\n호이!\n우린 13호 객차로\n\"류베리\"¹, 너흰 저 밖에 있어라!\n대열을 굳건히 하라\n아프가니스탄을 지켜라\n나는 가슴에 달린 평화 상징을 뜯어낸다\n나는 송곳니를 드러낸다\n나는 절대 믿지 않을 거야\n날씨가 변한다는 걸!\n날씨가 변한다는 걸!\n날씨가 변한다는 걸!\n날씨가 변한다는 걸!\n호이!\n\n\n## 원문\n\nГрязный стрём убаюкал гнев\nСтылый свист покорёжил нерв\nВас купили мясным куском\nА нас зарыли сырым песком\nТы видел бусы и цветные глаза\nВтоптанные в асфальт\nЯ никогда не поверю\nВ перемену погоды\nВ вашем горле застряла кость\nПо линейке всё вкривь да вкось\nУважайте своих вождей\nМойте руки перед едой\nЯ видел кровь на твоей щеке\nПодставленной под удар\nЯ никогда не поверю\nВ перемену погоды!\nВ перемену погоды!\nХой!\nНам в тринадцатый вагон\n\"Любера\", оставайтесь вон!\nУкрепляйте свои ряды\nЗащищайте Афганистан\nЯ срываю пацифик со своей груди\nЯ обнажаю клыки\nЯ никогда не поверю\nВ перемену погоды!\nВ перемену погоды!\nВ перемену погоды!\nВ перемену погоды!\nХой!\n\n## 해설\n\n그라즈단스카야 오보로나(Гражданская оборона, '민방위')는 1984년 옴스크에서 예고르 레토프와 콘스탄틴 랴비노프(쿠쟈 우오)가 결성한 밴드로, 소련 말기 시베리아 펑크를 대표하는 이름이다.\n\n이 곡은 소련 말기의 공기를 짧은 장면들로 담고 있다. '아프가니스탄을 지켜라', '지도자들을 공경하라', '식사 전에 손을 씻어라' 같은 구호가 나란히 놓이면서, 전쟁과 일상의 훈계가 같은 말투로 반복되는 사회를 비춘다. 가사에 등장하는 '류베리'는 당시 펑크나 히피 같은 비주류 청년들과 거리에서 충돌하던 청년 집단으로, 이 노래가 태어난 현장의 긴장감을 보여 준다.\n\n후렴은 '날씨가 바뀔 거라고 절대 믿지 않겠다'는 말을 반복하며 끝난다. 나는 이 곡을 들으며 21세기가 먼저 떠올랐다. 구호와 약속이 넘치는 시대일수록, 그것을 한 번 더 따져 보는 태도는 여전히 필요하다.\n\n¹ 류베리(Люберы): 1980년대 모스크바 근교 류베르치 출신의 청년 집단. 원문의 'Любера'는 이들을 부르던 속어이다.\n"</script>
