<h1 class="article-title">삶은 없고 사실이 있을 때</h1>
<div class="article-meta">
<time>2026-03-24</time>
<span class="dot">&middot;</span>
<span>3 min read</span>
</div>
</header>
<div class="divider"></div>
<div class="article-body" id="article-body"></div>
<script id="post-markdown" type="application/json">"---\ntitle: 삶은 없고 사실이 있을 때\ndate: 2026-03-24\nexcerpt: 거창한 '삶'보다, 나를 잊게 만드는 감각에 대하여\ntags: Lifestyle, Philosophy, Essay\nreading_minutes: 3\n---\n\n# 삶이 주는 허상\n\n'삶'은 참 거창한 거짓말이다. 모두가 '삶'이 무엇인지 말하려고 했지만, 수천 년이 지나도 '삶' 하나를 모른다.\n우주의 실마리를 잡기 시작하고 달에 가 본 인류가 그 '삶' 하나를 모른다.\n왜일까? 너무 어려워서? 인간이 고상해서? 모두 아니다. 애초에 '삶'이라는 것이 사실이 아니기 때문이다.\n\n심장이 뛰고, 뇌가 활동한다. 뇌는 감각을 받아들이고, 그에 따라 몸을 움직인다.\n이 문장은 대부분 사실로 이루어져 있다.\n\n반면 '삶을 초월하려면 이 가르침을 따르고 수행하라'는 문장은 사실이라기보다 해석과 권유에 가깝다. '예수님이 우리를 위해 돌아가셨으니 그분께 모든 것을 바쳐라'라는 말도, 믿는 사람에게는 깊은 의미를 지니지만 사실의 층위에서 보면 하나의 사건 위에 신앙의 해석이 얹힌 것이다.\n\n종교는 오랜 세월 수많은 사람에게 의미와 위로를 준 소중한 체계이다. 나는 그것을 부정하지 않는다. 다만 종교든 철학이든 어떤 의미 체계가 돈이나 세력의 논리에 휩쓸리면, 원래 전하려던 것은 가려지고 '삶이란 무엇인가'라는 거대한 말만 남기 쉽다.\n\n삶이 무엇인지 안다고 해서 화가 나지 않는 것도, 웃음이 나지 않는 것도 아니다.\n그 밑바닥에는 인간도 동물이라는 아주 당연한 사실이 있다.\n\n그렇다고 인간을 연산 장치로 격하하자는 말은 아니다. 새도 위기에 처한 동료를 돕고, 원숭이도 때로는 새끼를 버린다. 어느 정도의 지능을 가진 생물이라면 저마다의 '의견'을 가지는 것이 자연스럽다.\n그래서 내가 주목하고 싶은 것은 실존을 묻는 일이 아니라, '나를 잊는 감각'을 묻는 일이다.\n실존주의 같은 사상이 현대 문명에 남긴 큰 영향을 가볍게 여길 생각은 없다. 하지만 철학을 업으로 삼지 않는 우리에게는 논리나 사색보다 감각이 먼저일 때가 많다.\n\n새는 나무를 피해 날 때 '왼쪽으로 30도 트는 것이 비겁한가?' 같은 질문을 하지 않는다. 몸이 위험을 느끼고, 새는 말을 거치지 않고 곧바로 판단한다.\n인간에게는 이런 즉각적인 판단이 없다고 말하는 사람도 있다. 그러나 그것을 찾아내고 느낄 수 있다는 것은 꽤나 명확한 일이다.\n\n# 없어지는 느낌에 주목하라\n\n어떤 일을 할 때 '내가 사라지는 느낌'이 들 때가 있다. 말로 수백 번 설명해도 잘 전해지지 않지만, 비대해진 자의식에서 벗어나 오직 눈앞의 사실들을 조합하는 상태가 되게 해 주는 계기가 분명히 있다.\n누군가에게는 소설을 쓰는 일이고, 누군가에게는 도자기를 빚는 일이며, 또 누군가에게는 프로그래밍이다.\n\n그 느낌 속에서 하는 작업에는 '어차피 아무도 안 읽어 줄 텐데'나 '결국 창고에 들어갈 텐데' 같은 생각이 끼어들지 않는다. 그저 그 순간 가장 끌리는 선택을 하나씩 해 나갈 뿐이다.\n몰입의 정점에서는 내 이름도, 나이도, 직함도 떠오르지 않는다. 나는 주어진 상태에 반응하는 유기체가 되고, 사실들은 나를 통과해 지나간다. 나는 이 상태를 펑크 아티스트 로만 네우모예프의 가사에서 영감을 받아, 조금은 한국적으로 재해석한 '마음의 종교(Религия Сердца)'라고 부른다.\n\n물론 그렇게 만든 도자기가 누군가의 창고에서 백 년을 묵을 수도 있고, 정성껏 짠 코드가 회사의 오래된 저장소에서 30년째 잠들어 있을 수도 있다. 많은 작업물은 그렇게 잊힌다.\n하지만 그 작업을 하던 사람이 눈앞에서 보고 느낀 매혹까지 없던 일이 되지는 않는다. 그것을 부정하기 시작하면, 오히려 없는 것을 있는 것처럼 말하기가 쉬워진다.\n그래서 나는 '나'라는 허울 좋은 설명이 사라지고 사실만 남는 그 느낌에 주목한다.\n\n# 세계가 혼란하다, 아마겟돈은 아닐지도 모른다\n\n로만 네우모예프는 2024년의 한 인터뷰에서 세상이 혼란스러워 종말의 징조처럼 보이지만, 심판이 오기 전에 '마를레종 발레(Ballet de la Merlaison)'처럼 흐지부지 지나갈 수도 있겠다고 말했다. 나는 그 말이 인상 깊었다.\n지금 세계는 분명 어지럽고, 어딘가에서는 서로 총을 겨누고 있다. 그래도 아직은 '나를 잊는 일'을 금지하는 세계는 아니다.\n\n어떤 명분으로든 사람들의 이런 자유를 통째로 막으려는 시대가 올 수도 있다. 하지만 아직은 아니다. 우리에게는 아직 꿈틀거릴 여지가 남아 있고, 통제하려는 힘도 아직은 잠이 덜 깬 상태이다.\n\n권력은 지나치게 거칠어지면 스스로도 위태로워진다는 것을 잘 알고 있다. 그래서 대개는 적당한 선에서 균형을 잡으며 흘러간다. 역사 속 거대한 제국들도 영원하지 않았고, 한때 세계를 뒤덮었던 몽골 제국도 결국 여러 갈래로 나뉘었다. 세상은 생각보다 자주 극단이 아니라 어정쩡한 균형 속에서 굴러간다.\n\n# 그렇다면 나를 잊는 것을 찾아라\n\n자기계발서가 끝없이 쏟아지는 시대에, 나는 오히려 나를 잊는 법을 배우는 것이 더 중요하다고 본다.\n인간은 지나치게 많이 생각하도록 진화한 존재이다. 그런 인간에게 완전한 무아(無我)는 현실적이지 않다. 대신 잠시라도 나를 잊는 시간을 얻는 것, 그것이 가장 많은 것을 얻는 길이다.\n\n잊을 일을 찾아라. 그것이 집에서 아무것도 하지 않고 누워 있는 것이라도 괜찮으니, 나를 잊을 수 있어야 한다.\n그 뿌리를 더듬어 가는 일은 기성 사회의 눈에는 '젊은 나이에 철없는 짓'처럼 우습게 보일지도 모른다. 그리고 이것은 그렇게 보이라고 하는 일이다. 나는 아무런 생각 없이 사실들을 흘려보낼 뿐인데, 세상은 철이 없다느니 떠들면서 '나로부터 눈을 떼게' 되기 때문이다.\n\n돈이나 명예가 가장 중요한 것은 아니다. 나를 누군가의 편리한 도구로 만들 필요도 없고, 자의식만 커져서 거창한 말을 늘어놓는 사람이 될 필요도 없다. 사실을 사실대로 흘려보낼 줄 아는 사람에게는, 언젠가 돌아봤을 때 후회가 아니라 사실들의 연속이 남는다.\n"</script>
